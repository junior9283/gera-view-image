[package]
name = "gera-view-image"
version = "0.2.1"
description = "Visualizador de imagens para Linux"
authors = ["junior9283"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gera_view_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["avif", "bmp", "exr", "gif", "ico", "jpeg", "png", "rayon", "tga", "tiff", "webp"] }
jpeg-decoder = "0.3.2"
rayon = "1.12.0"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
# libheif 1.23 compilada estática (embedded-libheif): o Ubuntu 22.04 tem só a 1.12.
# AVIF: aom ligado dinamicamente (depends). HEIC: libde265 OPCIONAL, carregada com dlopen
# pelo plugin de native/heic (build.rs); o binário não pode ter libde265 como NEEDED
# (o CI confere com readelf). Não instalar libde265-dev no build: o cmake a ligaria.
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17", "embedded-libheif"] }
# Direto só para o build.rs receber DEP_HEIF_ROOT; versão fixa porque o plugin HEIC
# é compilado da fonte que esta versão embute.
libheif-sys = { version = "=5.3.1", default-features = false, features = ["v1_17", "embedded-libheif"] }
psd = "0.3.5"
resvg = "0.50.0"
rawler = "0.8.0"
tiff = "0.11.3"
unicode-normalization = "0.1.26"
thiserror = "2.0.21"
imagesize = "0.15.0"
serde_bytes = "0.11"
zbus = "5"
notify = "8"
base64 = "0.22"
gtk = "0.18"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.3"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.8"
kamadak-exif = "0.6.2"
# WebP com perda (libwebp compilada estática pelo libwebp-sys; nada novo no NEEDED).
webp = { version = "0.3", default-features = false }
crc32fast = "1"
# GUID do XMP estendido do JPEG (MD5 do pacote, exigido pela especificação).
md5 = "0.8"
# Gerência de cor (Lote 1): Rust puro, já vinha pela crate `image`; nada novo no NEEDED.
moxcms = "0.8.1"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tga", "tiff", "webp"] }

# Dependências otimizadas também em dev/test: os testes decodificam imagens grandes.
[profile.dev.package."*"]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind: pânico de decodificador com arquivo malformado vira erro só naquele documento.
panic = "unwind"
strip = true
