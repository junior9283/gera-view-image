[package]
name = "gera-view-image"
version = "0.1.0"
description = "Visualizador de imagens para Linux"
authors = ["junior9283"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gera_view_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "rayon", "tga", "tiff", "webp"] }
jpeg-decoder = "0.3.2"
rayon = "1.12.0"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
# v1_17: menor libheif suportada (a do sistema é 1.23).
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
psd = "0.3.5"
resvg = "0.50.0"
rawler = "0.8.0"
tiff = "0.11.3"
unicode-normalization = "0.1.26"
thiserror = "2.0.21"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tga", "tiff", "webp"] }

# Dependências otimizadas também em dev/test: os testes decodificam imagens grandes.
[profile.dev.package."*"]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind: pânico de decodificador com arquivo malformado vira erro só naquele documento.
panic = "unwind"
strip = true
