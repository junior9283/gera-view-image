name: CI

on:
  push:
    # ci/**: branches de depuração do próprio CI (ex.: ci/e2e-fix).
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

env:
  # libheif 1.23 é compilada estática (embedded-libheif); o AVIF usa libaom do sistema.
  # Os demais codecs ficam fora pelo toolchain src-tauri/cmake/libheif-codecs.cmake
  # (.cargo/config.toml), mesmo que algum -dev venha como dependência transitiva.
  # Sem libheif-dev (o linker pegaria a 1.12 dinâmica). libde265-0 (runtime) é para os testes de HEIC.
  APT_DEPS: libwebkit2gtk-4.1-dev cmake libaom-dev libde265-0 libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  lint-typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  vitest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node --test scripts/*.test.mjs

  cargo-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Bibliotecas NEEDED do binário (allowlist; sem libde265/libjpeg/libopenjp2)
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin gera-view-image
          scripts/check-needed.sh src-tauri/target/debug/gera-view-image

  e2e:
    # WebdriverIO + tauri-driver + WebKitWebDriver contra o binário release, num X virtual
    # (no Wayland a janela do driver pode não receber frames; ver docs/testes/armadilhas.md).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS webkit2gtk-driver xvfb dbus
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri, key: e2e-release }
      - run: cargo install tauri-driver --locked
      - run: npm ci
      # markup.e2e.ts precisa do gancho window.__gviMarkup, que só existe com VITE_E2E=1.
      - run: npm run build
        env: { VITE_E2E: "1" }
      - run: cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: E2E (viewer, file, markup)
        # Barramento de sessão próprio: a instância única (reabrir pelo 2º processo) depende dele.
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" npm run test:e2e
        env: { GDK_BACKEND: x11 }
