name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # libheif 1.23 é compilada estática (embedded-libheif); só os codecs vêm do sistema.
  # Sem libheif-dev de propósito: com ele o linker poderia pegar a libheif 1.12 dinâmica.
  APT_DEPS: libwebkit2gtk-4.1-dev cmake libde265-dev libaom-dev libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  lint-typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  vitest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node --test scripts/release.test.mjs

  cargo-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
