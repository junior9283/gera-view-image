name: Release

on:
  push:
    tags: ["v*"]

# Fluxo: build -> rascunho do release + portão de bibliotecas -> smoke dos pacotes -> publicar.
# O updater lê releases/latest/download/latest.json, que ignora rascunhos: nada chega aos
# usuários antes do job `publish`, que só roda se o portão e todos os smokes passarem.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # cria o rascunho e sobe os assets
    steps:
      - uses: actions/checkout@v4
      - name: Notas da versão (seção do CHANGELOG)
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Seção $v não encontrada no CHANGELOG.md" >&2; exit 1
          fi
          { echo "body<<NOTES_EOF"; cat release-notes.md; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          # libheif estática (embedded-libheif); AVIF via libaom.so.3 (depends). HEIC é opcional:
          # a libde265 é carregada com dlopen (Recommends). Os outros codecs ficam fora pelo
          # toolchain src-tauri/cmake/libheif-codecs.cmake; o check-needed abaixo confere.
          sudo apt-get install -y libwebkit2gtk-4.1-dev cmake libaom-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gera View Image ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          includeUpdaterJson: true
          releaseDraft: true
          args: --bundles deb,rpm,appimage
      - name: Bibliotecas NEEDED do binário (allowlist; sem libde265/libkvazaar/libjpeg/libopenjp2)
        run: scripts/check-needed.sh src-tauri/target/release/gera-view-image
      # O smoke usa os pacotes do próprio build (baixar assets de rascunho exigiria contents: write).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacotes
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  smoke-packages:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: deb, image: "ubuntu:22.04", pattern: "*.deb" }
          - { name: deb, image: "ubuntu:24.04", pattern: "*.deb" }
          # Sem Recommends: a libde265 não é instalada e o app precisa iniciar mesmo assim.
          - { name: deb-sem-libde265, image: "ubuntu:24.04", pattern: "*.deb" }
          # Fedora oficial não tem libde265 (só RPM Fusion): a weak dep é ignorada.
          - { name: rpm, image: "fedora:latest", pattern: "*.rpm" }
          # Contêiner sem FUSE: --appimage-extract-and-run extrai e roda sem montar.
          # O AppImage não leva GTK/GL (excludelist): vêm do sistema, como num desktop.
          - { name: appimage, image: "ubuntu:24.04", pattern: "*.AppImage" }
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: pacotes, path: all }
      - name: Separar o pacote ${{ matrix.pattern }}
        run: mkdir pkg && find all -name "${{ matrix.pattern }}" -exec cp {} pkg/ \;
      - name: Instalar e rodar --version em ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" -v "$PWD/scripts:/scripts:ro" ${{ matrix.image }} bash -euxc '
            app=gera-view-image
            case "${{ matrix.name }}" in
              deb) apt-get update && apt-get install -y /pkg/*.deb ;;
              deb-sem-libde265)
                apt-get update && apt-get install -y --no-install-recommends /pkg/*.deb
                # `! cmd` não aborta com set -e: o teste precisa de if explícito.
                if ldconfig -p | grep -q libde265; then echo "libde265 presente" >&2; exit 1; fi ;;
              rpm)
                dnf install -y /pkg/*.rpm
                if ldconfig -p | grep -q libde265; then echo "libde265 presente" >&2; exit 1; fi ;;
              appimage)
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-3-0t64 libgl1 libegl1 libgbm1
                # O nome do arquivo tem espaços (productName): copia para um caminho simples.
                cp /pkg/*.AppImage /gvi.AppImage && chmod +x /gvi.AppImage
                app="/gvi.AppImage --appimage-extract-and-run" ;;
            esac
            # --version sai antes de iniciar GTK/WebKit: não precisa de display,
            # mas exige que todas as bibliotecas dinâmicas do pacote estejam instaladas.
            $app --version | grep -E "^gera-view-image [0-9]+\.[0-9]+\.[0-9]+"
            # O WebKitGTK do Fedora é o mais novo da matriz: foi com ele que a janela sumia (0.3.0).
            if [ "${{ matrix.name }}" = rpm ]; then
              dnf install -y xorg-x11-server-Xvfb dbus-daemon xdotool ImageMagick
              /scripts/render-check.sh $app
            fi
          '

  publish:
    needs: [release, smoke-packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # só aqui o rascunho vira release público (e o latest.json fica visível)
    steps:
      - uses: actions/checkout@v4
      # Com releaseDraft, o latest.json pode sair com URLs .../download/untagged-<hash>/,
      # que quebram o updater depois de publicado: reescreve para a tag antes de publicar.
      - name: Corrigir as URLs do latest.json do rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir latest
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p latest.json -D latest
          scripts/fix-latest-json.sh latest/latest.json "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber latest/latest.json
      - name: Publicar o rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
